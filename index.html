    async function loadRepoAddons() {
      const storedStars = JSON.parse(localStorage.getItem('IT_POSSIBLE_USER_STARS') || '{}');
      const storedDownloads = JSON.parse(localStorage.getItem('IT_POSSIBLE_USER_DOWNLOADS') || '{}');
      let combined = [...MANUAL_PROJECTS];

      document.getElementById('repo-status').innerText = 'Check...';

      for (let id of KODI_ADDON_IDS) {
        if (combined.some(p => p.id === id)) continue;

        try {
          const xmlUrl = `${REPO_BASE_URL}${id}/addon.xml`;
          const res = await fetch(xmlUrl);
          if (!res.ok) continue;
          const xmlText = await res.text();

          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
          const addonNode = xmlDoc.getElementsByTagName('addon')[0];
          if (!addonNode) continue;

          const version = addonNode.getAttribute('version') || '1.0.0';
          let name = cleanKodiTags(addonNode.getAttribute('name') || id);
          
          let developer = 'mr-evil1';
          if (addonNode.hasAttribute('provider-name')) {
            developer = cleanKodiTags(addonNode.getAttribute('provider-name'));
          } else if (addonNode.hasAttribute('provider_name')) {
            developer = cleanKodiTags(addonNode.getAttribute('provider_name'));
          } else {
            const providerNode = xmlDoc.getElementsByTagName('provider_name')[0] || xmlDoc.getElementsByTagName('author')[0];
            if (providerNode && providerNode.textContent) {
              developer = cleanKodiTags(providerNode.textContent);
            }
          }

          let desc = '';
          const summaryNode = addonNode.getElementsByTagName('summary')[0];
          const descNode = addonNode.getElementsByTagName('description')[0];
          if (descNode && descNode.textContent) {
            desc = cleanKodiTags(descNode.textContent);
          } else if (summaryNode && summaryNode.textContent) {
            desc = cleanKodiTags(summaryNode.textContent);
          }

          let primaryIcon = `${REPO_BASE_URL}${id}/icon.png`;
          if (id === 'repository.kodi.media') {
            primaryIcon = `${REPO_BASE_URL}${id}/kodi-media.jpg`;
          } else if (id === 'plugin.video.megakino') {
            primaryIcon = `${REPO_BASE_URL}${id}/resources/media/icon.png`;
          } else if (id === 'plugin.video.gezkino') {
            primaryIcon = `${REPO_BASE_URL}${id}/media/icon.png`;
          }

          const zipUrl = `${REPO_BASE_URL}${id}/${id}-${version}.zip`;

          combined.push({
            id: id,
            title: name,
            developer: developer,
            version: version,
            date: version,
            image: primaryIcon,
            iconJpg: `${REPO_BASE_URL}${id}/icon.jpg`,
            resourcesPng: `${REPO_BASE_URL}${id}/resources/icon.png`,
            resourcesJpg: `${REPO_BASE_URL}${id}/resources/icon.jpg`,
            mediaPng: `${REPO_BASE_URL}${id}/resources/media/icon.png`,

            downloads: 0,
            kodiUrl: zipUrl,
            apkUrl: '',
            htmlUrl: '',
            trailerUrl: '',
            tags: ['Kodi', id.split('.')[1] || 'Addon']
          });
        } catch (e) {
          console.warn(`Konnte addon.xml für ${id} nicht laden`, e);

    function changeStars(id, delta) {
      const item = projects.find(p => p.id === id);

      item.userStars = Math.max(0, (item.userStars || 0) + delta);

      let storedStars = JSON.parse(localStorage.getItem('IT_POSSIBLE_USER_STARS') || '{}');
      if (item.userStars > 0) {
        storedStars[id] = item.userStars;

    function matchesCategory(item, cat) {
      if (cat === 'all') return true;
      const id = item.id.toLowerCase();
      if (cat === 'plugin.video' && id.startsWith('plugin.video')) return true;
      if (cat === 'script' && id.startsWith('script.')) return true;
      if (cat === 'service' && (id.startsWith('service.') || id.startsWith('plugin.program'))) return true;
      if (cat === 'repository' && id.startsWith('repository.')) return true;
      if (cat === 'android' && item.apkUrl && item.apkUrl.trim() !== '') return true;
      if (cat === 'web' && (item.htmlUrl && item.htmlUrl.trim() !== '' || (item.extraLinks && item.extraLinks.length > 0))) return true;
      return false;

    function generateThumbnailHTML(item) {
      let sources = [];
      
      if (item.id === 'plugin.video.gezkino') {
        sources = [
          'https://raw.githubusercontent.com/mr-evil1/kodi-media-repo/refs/heads/main/plugin.video.gezkino/media/icon.png',
          'https://raw.githubusercontent.com/mr-evil1/kodi-media-repo/refs/heads/main/plugin.video.gezkino/icon.png',
          'https://raw.githubusercontent.com/Chrisophy/GEZ-KiNO/refs/heads/main/resources/media/icon.png',
          'https://raw.githubusercontent.com/Chrisophy/GEZ-KiNO/refs/heads/main/icon.png'
        ];
      } else {
        sources = [
          item.image,
          item.mediaPng,
          item.resourcesPng,
          item.iconJpg,
          item.mediaJpg,
          item.resourcesJpg,
          item.fanartJpg,
          item.fanartPng,
          item.generatedImage
        ];
      }

      sources = sources.filter(Boolean);

      if (sources.length === 0) {
        return getFallbackPlaceholder(item);
      }

      const chainId = 'img_' + Math.random().toString(36).substring(2, 9);
      window[chainId] = sources;
      window[chainId + '_idx'] = 0;

      return `<img src="${sources[0]}" alt="${item.title}" class="w-full h-full object-contain p-1" onerror="
        window['${chainId}_idx']++;
        if(window['${chainId}_idx'] < window['${chainId}'].length) {
          this.src = window['${chainId}'][window['${chainId}_idx']];
        } else {
          this.onerror = null;
          this.src = 'https://placehold.co/600x400/0b1329/00f0ff?text=KODI+ADDON';
        }
      " />`;
    }

    function getFallbackPlaceholder(item) {
      return `
        <div class="w-full h-full bg-gradient-to-br from-blue-900 to-indigo-950 flex flex-col items-center justify-center p-3">
          <div class="w-12 h-12 rounded-xl bg-brand-black/60 border border-cyan-500/40 flex items-center justify-center mb-1">
            <i class="fa-solid fa-cubes text-2xl text-cyan-400"></i>
          </div>
          <span class="font-display text-[10px] font-bold tracking-widest text-slate-300 opacity-80 uppercase">${item.title}</span>
        </div>
      `;
    }

    function openLightbox(imgUrl, title) {
      if (!imgUrl || imgUrl.trim() === '') return;
      document.getElementById('lightbox-img').src = imgUrl;
      document.getElementById('modal-lightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('modal-lightbox').classList.add('hidden');
    }

    function openTrailerModal(url, title) {
      const player = document.getElementById('trailer-video-player');
      const source = document.getElementById('trailer-video-source');
      document.getElementById('trailer-title').innerHTML = `<i class="fa-solid fa-film text-purple-400"></i> Trailer: ${title}`;
      source.src = url;
      player.load();
      document.getElementById('modal-trailer').classList.remove('hidden');
      player.play().catch(e => console.log('Autoplay blockiert:', e));
    }

    function closeTrailerModal() {
      const player = document.getElementById('trailer-video-player');
      player.pause();
      document.getElementById('trailer-video-source').src = '';
      document.getElementById('modal-trailer').classList.add('hidden');
    }

    function incrementDownload(id) {
      const item = projects.find(p => p.id === id);
      if (!item) return;

      item.downloads = (item.downloads || 0) + 1;

      let storedDownloads = JSON.parse(localStorage.getItem('IT_POSSIBLE_USER_DOWNLOADS') || '{}');
      storedDownloads[id] = item.downloads;
      localStorage.setItem('IT_POSSIBLE_USER_DOWNLOADS', JSON.stringify(storedDownloads));

      renderToplist();
      updateStats();
    }

    function trackClick(id) {
      incrementDownload(id);
    }

    let dlInterval = null;
    function triggerDownload(id, url, label) {
      const item = projects.find(p => p.id === id);
      if (!item || !url) return;
      
      incrementDownload(id);

      document.getElementById('dl-title').innerText = `${item.title} (${label})`;
      const directBtn = document.getElementById('dl-direct-btn');
      directBtn.classList.add('hidden');
      directBtn.href = url;

      let count = 3;
      document.getElementById('dl-countdown').innerText = count;
      document.getElementById('modal-download').classList.remove('hidden');

      if (dlInterval) clearInterval(dlInterval);
      dlInterval = setInterval(() => {
        count--;
        if (count > 0) {
          document.getElementById('dl-countdown').innerText = count;
        } else {
          clearInterval(dlInterval);
          document.getElementById('dl-countdown').innerText = "BEREIT!";
          directBtn.classList.remove('hidden');
        }
      }, 1000);
    }

    function closeDlModal() {
      if (dlInterval) clearInterval(dlInterval);
      document.getElementById('modal-download').classList.add('hidden');
    }

    function openDetailModal(id) {
      const item = projects.find(p => p.id === id);
      if (!item) return;

      let extraLinksHTML = '';
      if (item.extraLinks && item.extraLinks.length > 0) {
        extraLinksHTML = `
          <div class="pt-3 border-t border-cyan-500/20">
            <span class="text-[10px] text-cyan-300 uppercase tracking-wider block mb-2 font-bold"><i class="fa-solid fa-link mr-1"></i> Zusätzliche Gadgets & Scraper Repos:</span>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${item.extraLinks.map(link => `
                <a href="${link.url}" target="_blank" onclick="trackClick('${item.id}')" class="glossy-button flex items-center space-x-2 p-2 rounded-lg bg-brand-black border border-cyan-500/30 text-xs text-slate-200 hover:text-cyan-300 hover:border-cyan-400">
                  <i class="fa-solid ${link.icon || 'fa-external-link-alt'} text-cyan-400"></i>
                  <span class="truncate">${link.label}</span>
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }

      document.getElementById('detail-content').innerHTML = `
        <div class="space-y-3">
          <div class="w-full h-44 rounded-lg overflow-hidden border border-cyan-500/30 relative flex items-center justify-center bg-brand-black cursor-pointer group" onclick="openLightbox('${item.image}', '${item.title}')">
            ${generateThumbnailHTML(item)}
            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-cyan-300 text-xs font-bold gap-1.5 z-10">
              <i class="fa-solid fa-expand"></i> Im Vollbild anzeigen
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-cyan-500/20 pb-2.5">
            <div>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/40">Entwickler: ${item.developer || 'IT(\'s) Possible'}</span>
              <h2 class="text-base sm:text-lg font-bold text-white mt-1">${item.title}</h2>
            </div>
            <div class="text-right text-[11px] text-slate-400">
              <div>Version: <strong class="text-white">${item.version || 'v1.0'}</strong></div>
              <div>Datum: <strong class="text-white">${item.date || '2026'}</strong></div>
            </div>
          </div>
          <p class="text-xs text-slate-200 leading-relaxed bg-brand-black/60 p-3 rounded-xl border border-cyan-500/20">${item.desc}</p>
          
          ${extraLinksHTML}

          ${item.tags && item.tags.length > 0 ? `<div class="flex flex-wrap gap-1">${item.tags.map(t => `<span class="text-[10px] px-2 py-0.5 rounded bg-cyan-950/60 text-cyan-300 border border-cyan-500/30">#${t}</span>`).join('')}</div>` : ''}
          
          <div class="pt-2">
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block mb-2">Verfügbare Mirrors & Plattformen:</span>
            <div class="flex flex-wrap gap-2">
              ${item.trailerUrl ? `<button onclick="openTrailerModal('${item.trailerUrl}', '${item.title}')" class="glossy-button px-3 py-2 bg-purple-600 text-white text-xs font-bold rounded-lg flex items-center gap-1.5"><i class="fa-solid fa-play"></i> Trailer abspielen</button>` : ''}
              ${item.kodiUrl ? `<button onclick="triggerDownload('${item.id}', '${item.kodiUrl}', 'Kodi ZIP')" class="glossy-button px-3 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg flex items-center gap-1.5"><i class="fa-solid fa-cube"></i> Kodi Addon</button>` : ''}
              ${item.apkUrl ? `<button onclick="triggerDownload('${item.id}', '${item.apkUrl}', 'Android APK')" class="glossy-button px-3 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg flex items-center gap-1.5"><i class="fa-brands fa-android"></i> Android APK</button>` : ''}
              ${item.htmlUrl ? `<a href="${item.htmlUrl}" target="_blank" onclick="trackClick('${item.id}')" class="glossy-button px-3 py-2 bg-cyan-600 text-white text-xs font-bold rounded-lg flex items-center gap-1.5"><i class="fa-solid fa-globe"></i> HTML Web-Link</a>` : ''}
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-detail').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('modal-detail').classList.add('hidden');
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto glossy-reflection px-3 py-2 rounded-lg border border-cyan-400 bg-brand-card text-white text-xs font-bold shadow-[0_0_15px_rgba(0,240,255,0.4)] flex items-center space-x-2`;
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-cyan-400 text-sm"></i><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }
  </script>
</body>
</html>
