<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kodi Dev - Codec & XML Escaper</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    header {
      background: #161b22;
      padding: 12px 16px;
      border-bottom: 1px solid #30363d;
      font-size: 16px;
      font-weight: bold;
      color: #58a6ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 12px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    @media(min-width: 768px) {
      .main-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }
    label {
      font-size: 12px;
      color: #8b949e;
      font-weight: bold;
    }
    textarea {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      min-height: 80px;
      box-sizing: border-box;
    }
    textarea:focus {
      border-color: #58a6ff;
      outline: none;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      flex: 1;
    }
    button:hover {
      background: #2ea043;
    }
    button.secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }
    button.secondary:hover {
      background: #30363d;
    }
  </style>
</head>
<body>

  <header>
    <span>🔤 Codec, JSON & XML Escaper</span>
    <span style="font-size: 12px; color: #8b949e;">Tools v1.0</span>
  </header>

  <div class="main-container">

    <!-- 1. XML Entity Escaper (Wichtig für Skins) -->
    <div class="card">
      <label>1. XML ENTITY ESCAPER (Für Kodi Skins / home.xml)</label>
      <textarea id="xml-input" placeholder="Text mit Sonderzeichen (&, <, >)...">Willkommen bei Kodi & Co. - "Addon-Check" < 100% Erfolgreich!</textarea>
      <div class="btn-row">
        <button onclick="escapeXml()">Escape (&gt; XML)</button>
        <button class="secondary" onclick="unescapeXml()">Unescape</button>
      </div>
      <textarea id="xml-output" placeholder="Ergebnis..." readonly></textarea>
    </div>

    <!-- 2. Base64 Encoder / Decoder -->
    <div class="card">
      <label>2. BASE64 ENCODER / DECODER</label>
      <textarea id="b64-input" placeholder="Text eingeben..."></textarea>
      <div class="btn-row">
        <button onclick="encodeB64()">Kodieren</button>
        <button class="secondary" onclick="decodeB64()">Dekodieren</button>
      </div>
      <textarea id="b64-output" placeholder="Ergebnis..." readonly></textarea>
    </div>

    <!-- 3. URL Encoder / Decoder -->
    <div class="card">
      <label>3. URL ENCODER / DECODER (Python urllib Stil)</label>
      <textarea id="url-input" placeholder="URL oder Parameter eingeben..."></textarea>
      <div class="btn-row">
        <button onclick="encodeUrl()">Kodieren</button>
        <button class="secondary" onclick="decodeUrl()">Dekodieren</button>
      </div>
      <textarea id="url-output" placeholder="Ergebnis..." readonly></textarea>
    </div>

    <!-- 4. JSON Formatter -->
    <div class="card">
      <label>4. JSON FORMATTER & VALIDATOR</label>
      <textarea id="json-input" placeholder='{"plugin": "video", "active": true}'></textarea>
      <div class="btn-row">
        <button onclick="formatJson()">Formatieren (Pretty)</button>
        <button class="secondary" onclick="minifyJson()">Minifizieren</button>
      </div>
      <textarea id="json-output" placeholder="Ergebnis..." readonly></textarea>
    </div>

  </div>

  <script>
    // 1. XML Escaping
    function escapeXml() {
      let str = document.getElementById('xml-input').value;
      let map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' };
      document.getElementById('xml-output').value = str.replace(/[&<>"']/g, m => map[m]);
    }
    function unescapeXml() {
      let str = document.getElementById('xml-input').value;
      let map = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&apos;': "'" };
      document.getElementById('xml-output').value = str.replace(/&amp;|&lt;|&gt;|&quot;|&apos;/g, m => map[m]);
    }

    // 2. Base64
    function encodeB64() {
      try {
        document.getElementById('b64-output').value = btoa(unescape(encodeURIComponent(document.getElementById('b64-input').value)));
      } catch(e) { document.getElementById('b64-output').value = "Fehler beim Kodieren!"; }
    }
    function decodeB64() {
      try {
        document.getElementById('b64-output').value = decodeURIComponent(escape(atob(document.getElementById('b64-input').value)));
      } catch(e) { document.getElementById('b64-output').value = "Ungültiger Base64 String!"; }
    }

    // 3. URL
    function encodeUrl() {
      document.getElementById('url-output').value = encodeURIComponent(document.getElementById('url-input').value);
    }
    function decodeUrl() {
      try {
        document.getElementById('url-output').value = decodeURIComponent(document.getElementById('url-input').value);
      } catch(e) { document.getElementById('url-output').value = "Ungültiger URL String!"; }
    }

    // 4. JSON
    function formatJson() {
      try {
        let obj = JSON.parse(document.getElementById('json-input').value);
        document.getElementById('json-output').value = JSON.stringify(obj, null, 4);
      } catch(e) {
        document.getElementById('json-output').value = "JSON Syntaxfehler: " + e.message;
      }
    }
    function minifyJson() {
      try {
        let obj = JSON.parse(document.getElementById('json-input').value);
        document.getElementById('json-output').value = JSON.stringify(obj);
      } catch(e) {
        document.getElementById('json-output').value = "JSON Syntaxfehler: " + e.message;
      }
    }

    // Init einmal ausführen
    escapeXml();
  </script>

</body>
</html>
