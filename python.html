<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kodi Dev - Python REPL</title>
  <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    header {
      background: #161b22;
      padding: 12px 16px;
      border-bottom: 1px solid #30363d;
      font-size: 16px;
      font-weight: bold;
      color: #58a6ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
    }
    @media(min-width: 768px) {
      .main-container {
        flex-direction: row;
      }
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12px;
      color: #8b949e;
      font-weight: bold;
    }
    textarea, pre {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      resize: none;
      box-sizing: border-box;
    }
    textarea:focus {
      border-color: #58a6ff;
      outline: none;
    }
    pre {
      margin: 0;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .btn-bar {
      display: flex;
      gap: 10px;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      flex: 1;
    }
    button:hover {
      background: #2ea043;
    }
    button.clear {
      background: #21262d;
      border: 1px solid #30363d;
      color: #f85149;
    }
    button.clear:hover {
      background: #30363d;
    }
  </style>
</head>
<body onload="brython()">

  <header>
    <span>🐍 Kodi Python Interpreter (Brython)</span>
    <span style="font-size: 12px; color: #8b949e;">Python 3.11</span>
  </header>

  <div class="main-container">
    <!-- Eingabe -->
    <div class="pane">
      <label for="code-input">PYTHON CODE EINGEBEN:</label>
      <textarea id="code-input" spellcheck="false"># Schreibe deinen Python Code hier...
import json

addon_info = {
    "id": "plugin.video.meinkodi",
    "version": "1.0.0",
    "name": "Mein Kodi Addon"
}

print("Addon-Konfiguration:")
print(json.dumps(addon_info, indent=4))

# Schleifentest
for i in range(1, 4):
    print(f"Lade Menüpunkt {i}...")</textarea>
      
      <div class="btn-bar">
        <button id="run-btn">▶ Ausführen</button>
        <button class="clear" id="clear-btn">Löschen</button>
      </div>
    </div>

    <!-- Ausgabe -->
    <div class="pane">
      <label for="output">AUSGABE (STDOUT):</label>
      <pre id="output">Bereit für Ausführung...</pre>
    </div>
  </div>

  <script type="text/python">
    from browser import document, window
    import sys
    import io

    def run_python(ev):
        code = document["code-input"].value
        output_elem = document["output"]
        
        # Umleitung von stdout, um print()-Ausgaben abzufangen
        old_stdout = sys.stdout
        new_stdout = io.StringIO()
        sys.stdout = new_stdout
        
        output_elem.text = ""
        
        try:
            # Code im globalen Kontext ausführen
            exec(code, {})
            result = new_stdout.getvalue()
            output_elem.text = result if result else "[Skript ohne Ausgabe beendet]"
            output_elem.style.color = "#c9d1d9"
        except Exception as e:
            output_elem.text = f"Fehler: {str(e)}"
            output_elem.style.color = "#ff7b72"
        finally:
            sys.stdout = old_stdout

    def clear_console(ev):
        document["output"].text = ""

    document["run-btn"].bind("click", run_python)
    document["clear-btn"].bind("click", clear_console)
  </script>

</body>
</html>
